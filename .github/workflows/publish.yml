name: Assemble and publish MV Maker Signal Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 17 * * *'     # 1:00 PM ET
    - cron: '0 23 * * *'     # 7:00 PM ET

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pulls new delta files from the shared Google Drive folder.
      # Does nothing until BOTH are set: variable GDRIVE_FOLDER_ID, secret GDRIVE_API_KEY.
      - name: Fetch deltas from Drive
        env:
          KEY: ${{ secrets.GDRIVE_API_KEY }}
          FOLDER: ${{ vars.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p drive
          if [ -z "${KEY:-}" ] || [ -z "${FOLDER:-}" ]; then
            echo "Drive not configured yet - skipping fetch."
            exit 0
          fi
          curl -sS -G "https://www.googleapis.com/drive/v3/files" \
            --data-urlencode "q='${FOLDER}' in parents and trashed=false" \
            --data-urlencode "fields=files(id,name)" \
            --data-urlencode "key=${KEY}" -o /tmp/list.json
          python3 fetch_deltas.py /tmp/list.json drive

      - name: Assemble and build
        run: |
          set -euo pipefail
          mkdir -p drive
          cp signals.json base-signals.json
          python3 assemble.py drive base-signals.json signals.json
          python3 build_dashboard.py signals.json index.html
          rm -f base-signals.json
          mkdir -p _site
          cp index.html signals.json _site/

      - name: Commit updated corpus
        run: |
          git config user.name  "mv-maker-scan-bot"
          git config user.email "actions@github.com"
          git add signals.json index.html drive/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "scan: assemble deltas and rebuild $(date -u +%F)"
          git push || echo "push skipped - check Settings > Actions > General > Workflow permissions"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
